<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>La Ruleta de la Buena Salud · HGW</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Orbitron:wght@600;700;800&display=swap');
:root{
  --bg:#04100a;--mid:#0b2615;--pa:#103820;--pb:#184c2b;
  --cy:#39e28f;--gold:#f5c542;--hi:#eafef3;--lo:#a1c8b3;
  --sa:#ff2e93;--sb:#ffd23f;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  min-height:100vh;min-height:100dvh;color:var(--hi);font-family:'Montserrat',sans-serif;
  background:
    radial-gradient(ellipse 60% 40% at 20% 10%,rgba(57,226,143,.2),transparent 60%),
    radial-gradient(ellipse 55% 45% at 85% 90%,rgba(34,194,184,.14),transparent 60%),
    linear-gradient(160deg,var(--bg),var(--mid) 50%,var(--bg));
  display:flex;flex-direction:column;align-items:center;overflow-x:hidden;position:relative;
  padding:clamp(18px,4vw,28px) 14px max(28px,env(safe-area-inset-bottom));
}
#fx,#stars{position:fixed;inset:0;pointer-events:none}
#stars{z-index:0}#fx{z-index:50;width:100%;height:100%}
.star{position:absolute;background:#fff;border-radius:50%;opacity:.4;animation:tw linear infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.8}}
.aurora{position:fixed;inset:-30%;z-index:0;pointer-events:none;
  background:conic-gradient(from 0deg at 50% 50%,rgba(57,226,143,.07),transparent 30%,rgba(34,194,184,.07) 55%,transparent 80%,rgba(57,226,143,.07));
  animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* marca */
.brand{position:absolute;top:clamp(12px,3vw,22px);left:clamp(12px,3vw,22px);z-index:10;
  width:clamp(44px,10vw,66px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  background:#0f351e;border:2px solid rgba(57,226,143,.6);box-shadow:0 0 18px rgba(57,226,143,.4)}
.brand img{width:100%;height:100%;object-fit:contain;padding:2px;display:none}
.brand b{font:800 clamp(.6rem,2.4vw,.8rem)/1 'Orbitron',sans-serif;color:var(--cy);letter-spacing:1px}

/* encabezado */
header{position:relative;z-index:2;text-align:center;margin-top:clamp(10px,2vw,18px);max-width:640px}
.wordmark{font:800 clamp(1.5rem,6.4vw,2.4rem)/1 'Orbitron',sans-serif;letter-spacing:clamp(3px,1.4vw,8px);
  background:linear-gradient(180deg,#f2fdf7,#b4f2d3 35%,#59c48b 70%,#246b45);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 16px rgba(57,226,143,.4))}
.tagline{margin-top:8px;font-size:clamp(.7rem,2.4vw,.85rem);font-weight:600;letter-spacing:2px;color:var(--lo)}
.badge{margin-top:12px;display:inline-flex;align-items:center;gap:8px;font:600 clamp(.56rem,1.9vw,.64rem) 'Orbitron',sans-serif;
  letter-spacing:2px;color:var(--cy);padding:5px 14px;border:1px solid rgba(57,226,143,.35);border-radius:20px;background:rgba(57,226,143,.06)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--cy);box-shadow:0 0 8px var(--cy);animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}

/* escenario */
.stage{position:relative;z-index:2;width:clamp(260px,92vmin,600px);aspect-ratio:1;margin:clamp(22px,5vw,36px) auto 8px;display:grid;place-items:center}
.frame{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#c9ecdc,#3a6650 15deg,#c9ecdc 30deg,#3a6650 45deg,#c9ecdc 60deg,#3a6650 75deg,#c9ecdc 90deg,#3a6650 105deg,#c9ecdc 120deg,#3a6650 135deg,#c9ecdc 150deg,#3a6650 165deg,#c9ecdc 180deg,#3a6650 195deg,#c9ecdc 210deg,#3a6650 225deg,#c9ecdc 240deg,#3a6650 255deg,#c9ecdc 270deg,#3a6650 285deg,#c9ecdc 300deg,#3a6650 315deg,#c9ecdc 330deg,#3a6650 345deg,#c9ecdc);
  opacity:.18;transition:opacity .6s,box-shadow .6s}
.frame::before{content:'';position:absolute;inset:14px;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,#10351e,#081d11 60%,#030e07);
  box-shadow:inset 0 0 0 2px rgba(150,240,190,.18),inset 0 10px 40px rgba(0,0,0,.65),0 0 60px rgba(20,160,80,.3)}
.stage.win .frame{opacity:.4}
.ring{position:absolute;inset:6%;width:88%;height:88%}
.ring circle{fill:none}
.ring .t{stroke:rgba(140,240,190,.1);stroke-width:.5}
.ring .s{stroke:var(--cy);stroke-width:.7;stroke-linecap:round;stroke-dasharray:16 280;filter:drop-shadow(0 0 3px var(--cy));animation:sw 5.5s linear infinite}
@keyframes sw{to{stroke-dashoffset:-296}}
.rotor{position:absolute;inset:10%;border-radius:50%;will-change:transform;
  box-shadow:inset 0 0 60px rgba(0,0,0,.55),inset 0 0 90px rgba(57,226,143,.08)}
.rotor::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle,transparent 40%,rgba(0,0,0,.55))}

.chip{position:absolute;top:50%;left:50%;width:clamp(58px,15.6vmin,104px);display:block;text-decoration:none;color:var(--hi);
  touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:opacity .3s,filter .3s}
.card{display:flex;flex-direction:column;align-items:center;gap:5px;padding:clamp(6px,1.8vmin,10px) clamp(4px,1.4vmin,8px);border-radius:14px;
  background:linear-gradient(160deg,rgba(16,56,32,.88),rgba(6,22,12,.92));
  border:1px solid color-mix(in srgb,var(--ac) 55%,#1c5033);
  box-shadow:0 4px 14px rgba(0,0,0,.5),0 0 16px color-mix(in srgb,var(--ac) 35%,transparent)}
.card svg{width:clamp(16px,4.2vmin,22px);height:clamp(16px,4.2vmin,22px);stroke:var(--ac);filter:drop-shadow(0 0 5px var(--ac))}
.card span{font:600 clamp(.46rem,1.6vmin,.58rem)/1.15 'Orbitron',sans-serif;text-align:center}
.chip.feat .card{box-shadow:0 4px 16px rgba(0,0,0,.55),0 0 26px color-mix(in srgb,var(--ac) 60%,transparent)}
.chip.sur{cursor:default}
.chip.sur .card{background:linear-gradient(160deg,var(--sa),var(--sb));border-color:rgba(255,255,255,.45);animation:sp 1.8s ease-in-out infinite}
.chip.sur svg{stroke:#22081a;filter:none}.chip.sur span{color:#22081a;font-weight:800}
@keyframes sp{50%{box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 38px var(--sa)}}
.chip[data-lock="1"]{pointer-events:none;opacity:.55;filter:saturate(.5)}
.chip.won{opacity:1;filter:none;z-index:3}
.chip.won .card{border-color:var(--ac);animation:won 1.2s ease-in-out infinite}
@keyframes won{50%{box-shadow:0 0 44px var(--ac),0 0 0 3px color-mix(in srgb,var(--ac) 50%,transparent)}}
.chip:focus-visible .card{outline:2px solid var(--cy);outline-offset:2px}

.pointer{position:absolute;top:1.4%;left:50%;transform:translateX(-50%);z-index:5;transform-origin:50% 10%}
.pointer i{display:block;width:0;height:0;border-left:clamp(8px,2.2vmin,12px) solid transparent;border-right:clamp(8px,2.2vmin,12px) solid transparent;
  border-top:clamp(14px,3.6vmin,20px) solid var(--cy);filter:drop-shadow(0 0 8px var(--cy))}
.glow{position:absolute;top:2%;left:50%;width:clamp(80px,24vmin,140px);height:56%;transform:translateX(-50%);
  clip-path:polygon(50% 0,0 100%,100% 100%);background:linear-gradient(180deg,color-mix(in srgb,var(--ac,#39e28f) 60%,transparent),transparent);
  opacity:0;transition:opacity .5s;pointer-events:none;z-index:3}
.glow.on{opacity:.5}

/* centro */
.hub{position:absolute;z-index:6;width:38%;aspect-ratio:1;border-radius:50%;display:flex;
  background:radial-gradient(circle at 50% 38%,#1c5436,#0b2c19 62%,#05170d);
  box-shadow:0 0 0 2px rgba(160,255,200,.25),0 0 0 8px rgba(6,24,14,.9),0 10px 30px rgba(0,0,0,.7),0 0 44px rgba(57,226,143,.22)}
.hub div{margin:auto;width:84%;height:84%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.2vmin,8px);
  text-align:center;padding:6px;border:1px solid rgba(140,240,190,.14)}
.hub small{font:600 clamp(.46rem,1.8vmin,.62rem) 'Orbitron',sans-serif;letter-spacing:1.5px;color:var(--lo)}
#status{font:600 clamp(.48rem,1.8vmin,.62rem)/1.25 'Orbitron',sans-serif;color:var(--cy);min-height:2.5em;display:flex;align-items:center;padding:0 4px}
#spin{font:700 clamp(.58rem,2.1vmin,.76rem) 'Orbitron',sans-serif;letter-spacing:1.5px;color:#041c10;border:0;cursor:pointer;
  padding:clamp(8px,2.4vmin,11px) clamp(14px,4vmin,20px);border-radius:30px;touch-action:manipulation;
  background:linear-gradient(180deg,var(--cy),#17b06b);box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 0 18px rgba(57,226,143,.55);
  transition:transform .2s,box-shadow .2s}
#spin:hover{transform:translateY(-2px)}#spin:active{transform:scale(.96)}
#spin.alert{background:linear-gradient(180deg,#ff8a3d,#c94f1c);animation:ap 1.8s ease-in-out infinite}
@keyframes ap{50%{box-shadow:0 0 30px rgba(255,138,61,.9)}}
#spin:disabled{opacity:.7;cursor:wait;animation:none}
#spin:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* resultado */
.result{position:relative;z-index:2;width:min(520px,92vw);margin-top:clamp(14px,3vw,22px);display:none;align-items:center;gap:14px;
  padding:14px 16px;border-radius:18px;background:linear-gradient(160deg,rgba(16,56,32,.9),rgba(6,22,12,.95));
  border:1px solid color-mix(in srgb,var(--ac) 70%,transparent);box-shadow:0 0 34px color-mix(in srgb,var(--ac) 40%,transparent)}
.result.show{display:flex;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}}
.r-ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 18%,transparent)}
.r-ico svg{width:26px;height:26px;stroke:var(--ac)}
.r-txt{flex:1;min-width:0}
.r-txt strong{display:block;font:700 clamp(.8rem,3vw,.95rem) 'Orbitron',sans-serif}
.r-txt p{margin-top:4px;font-size:clamp(.72rem,2.5vw,.8rem);line-height:1.4;color:var(--lo)}
.r-cta{flex:none;text-decoration:none;font:700 .72rem 'Orbitron',sans-serif;color:#041c10;padding:10px 16px;border-radius:24px;
  background:linear-gradient(180deg,#fff,#cfe9db);box-shadow:0 0 16px rgba(255,255,255,.35);white-space:nowrap}
.r-cta:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
@media(max-width:420px){.result{flex-wrap:wrap}.r-cta{width:100%;text-align:center}}

/* lista y pie */
.lt{position:relative;z-index:2;margin-top:clamp(18px,4vw,26px);background:none;border:0;color:var(--lo);font:500 clamp(.72rem,2.4vw,.78rem) 'Montserrat',sans-serif;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}
.lt:hover{color:var(--hi)}
.fl{position:relative;z-index:2;display:none;width:min(500px,92vw);margin-top:12px;flex-direction:column;gap:10px}
.fl.show{display:flex}
.fl a{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-radius:12px;text-decoration:none;color:var(--hi);
  background:linear-gradient(160deg,rgba(16,56,32,.7),rgba(6,22,12,.8));border:1px solid rgba(140,240,190,.16);font-size:.8rem;font-weight:600}
.fl a:hover{border-color:var(--cy)}
footer{position:relative;z-index:2;margin-top:clamp(26px,6vw,42px);text-align:center;font-size:clamp(.6rem,2vw,.7rem);color:var(--lo);opacity:.75;max-width:520px}
@media(max-height:640px) and (orientation:landscape){.stage{width:clamp(220px,60vh,420px);margin:14px auto 4px}}
@media(prefers-reduced-motion:reduce){.aurora,.ring .s,.star,.badge i{animation:none!important}}
</style>
</head>
<body>
<div class="brand"><img id="logo" alt="Logo HGW"><b id="mono">HGW</b></div>
<div class="aurora"></div><div id="stars"></div><canvas id="fx"></canvas>

<header>
  <div class="wordmark">HGW</div>
  <p class="tagline">La ruleta de la buena salud</p>
  <div class="badge"><i></i>Acceso exclusivo</div>
</header>

<div class="stage" id="stage">
  <div class="frame" id="frame"></div>
  <svg class="ring" viewBox="0 0 100 100"><circle class="t" cx="50" cy="50" r="47"/><circle class="s" cx="50" cy="50" r="47"/></svg>
  <div class="glow" id="glow"></div>
  <div class="pointer" id="pointer"><i></i></div>
  <div class="rotor" id="rotor"></div>
  <div class="hub"><div>
    <small>PANEL DE CONTROL</small>
    <span id="status" aria-live="polite">Toca «Detener» para elegir</span>
    <button id="spin" class="alert">Detener</button>
  </div></div>
</div>

<section class="result" id="result" aria-live="polite">
  <div class="r-ico" id="rIco"></div>
  <div class="r-txt"><strong id="rTitle"></strong><p id="rDesc"></p></div>
  <a class="r-cta" id="rCta" target="_blank" rel="noopener">Acceder →</a>
</section>

<button class="lt" id="lt">¿Prefieres ver todas las opciones en una lista? Ver lista</button>
<nav class="fl" id="fl"></nav>
<footer>Copyright©2026. Propiedad de TechRep S.R.L. Todos los derechos reservados.</footer>

<script>
/* ===== CONFIGURACIÓN ===== */
// Pega aquí tu logo (data:image/png;base64,... o una URL). Si queda vacío se muestra el monograma HGW.
const LOGO_SRC = '';

const ICONS = {
  hub_node:'<path d="M12 2 19 6.5V17.5L12 22 5 17.5V6.5Z"/><circle cx="12" cy="12" r="2.2"/>',
  bubble:'<path d="M4 5h16v11H8l-4 4V5Z"/>',
  headphones:'<path d="M4 13v-1a8 8 0 0 1 16 0v1"/><rect x="3" y="13" width="4" height="6" rx="1.4"/><rect x="17" y="13" width="4" height="6" rx="1.4"/>',
  bag:'<path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  image:'<rect x="3" y="4" width="18" height="14" rx="2"/><circle cx="8.5" cy="9.5" r="1.4"/><path d="M21 16l-5-5-4 4-3-3-5 5"/>',
  gauge:'<path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15 16 9"/><circle cx="12" cy="15" r="1.1"/>',
  heart:'<path d="M12 20s-7-4.4-9.5-9C1 7.6 3 4 6.5 4 9 4 11 6 12 7.5 13 6 15 4 17.5 4 21 4 23 7.6 21.5 11 19 15.6 12 20 12 20Z"/><path d="M6 12h2l1.5-3 2 5 1.5-2h4"/>',
  gift:'<rect x="3" y="9" width="18" height="11" rx="1.4"/><path d="M3 9h18M12 9v11"/><path d="M12 9c-1.6 0-2.6-.5-3.4-1.3C7.7 6.8 7.7 5 9 4.2c1.3-.8 2.5 0 3 1.3.5-1.3 1.7-2.1 3-1.3 1.3.8 1.3 2.6.4 3.5C14.6 8.5 13.6 9 12 9Z"/>'
};
const SEGMENTS = [
  {label:'Plan de Compensación',desc:'Conoce cómo ganar con HGW paso a paso.',href:'https://multilabintl.wixsite.com/raquel-plan-fwp',icon:'hub_node',accent:'#f5c542',feat:true},
  {label:'Facebook',desc:'Súmate a la comunidad y sigue las novedades.',href:'https://www.facebook.com/share/1dJvZRuFie/?mibextid=wwXIfr',icon:'bubble',accent:'#2fa2ff'},
  {label:'Audios de estrategia',desc:'Escucha ideas prácticas para crecer tu negocio.',href:'https://open.spotify.com/show/0Hv3xC590KwfSH0d4lBgcu?si=O158l2A_RaK0Pb4B2dsDUQ',icon:'headphones',accent:'#8c6bff'},
  {label:'Tienda virtual',desc:'Mira los productos y haz tu pedido en línea.',href:'https://multilabintl.wixsite.com/raquel-tienda',icon:'bag',accent:'#39e28f'},
  {label:'Sorpresa',icon:'gift',accent:'#ff2e93',sur:true},
  {label:'Flyers descargables',desc:'Descarga material listo para compartir.',href:'https://multilabintl.wixsite.com/raquel-flyers',icon:'image',accent:'#22c2b8'},
  {label:'Bajar de peso',desc:'Calcula tu IMC y recibe una guía para empezar.',href:'https://multilabintl.wixsite.com/raquel-imc',icon:'gauge',accent:'#26ab9f'},
  {label:'Chequeo de salud actual',desc:'Responde unas preguntas y recibe recomendaciones.',href:'https://multilabintl.wixsite.com/fwp-consulta',icon:'heart',accent:'#ff5f9e'},
  {label:'Sorpresa',icon:'gift',accent:'#ff2e93',sur:true}
];
const TIPS = [
  'Toma un vaso de agua al despertar: tu cuerpo lleva horas sin hidratarse.',
  'Camina 10 minutos después de comer; ayuda a tu digestión y a tu energía.',
  'Dormir 7 a 8 horas es parte de tu plan de salud, no un lujo.',
  'Pon verduras en la mitad de tu plato en al menos una comida al día.',
  'Respira profundo 1 minuto antes de comer: comerás más tranquilo y más consciente.',
  'Estírate 5 minutos al levantarte y notarás menos rigidez durante el día.'
];

/* ===== UTILIDADES ===== */
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = SEGMENTS.length, SEG = 360 / N;
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;

/* logo con respaldo */
(function(){
  const img = $('logo'), mono = $('mono');
  if(!LOGO_SRC) return;
  img.onload = () => { img.style.display = 'block'; mono.style.display = 'none'; };
  img.onerror = () => { img.style.display = 'none'; mono.style.display = ''; };
  img.src = LOGO_SRC;
})();

/* estrellas */
(function(){
  const f = $('stars'), fr = document.createDocumentFragment();
  for(let i=0;i<70;i++){
    const s = document.createElement('div'), z = Math.random()*2+.6;
    s.className = 'star';
    s.style.cssText = `width:${z}px;height:${z}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-duration:${Math.random()*3+2}s;animation-delay:${Math.random()*3}s`;
    fr.appendChild(s);
  }
  f.appendChild(fr);
})();

/* remaches */
(function(){
  const fm = $('frame');
  for(let i=0;i<16;i++){
    const a = i/16*2*Math.PI, r = document.createElement('div');
    r.style.cssText = `position:absolute;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#dcefdb,#5a9272 60%,#265038);top:${50-48*Math.cos(a)}%;left:${50+48*Math.sin(a)}%;transform:translate(-50%,-50%)`;
    fm.appendChild(r);
  }
})();

/* ===== RUEDA ===== */
const rotor = $('rotor'), chips = [];
(function(){
  const stops = [];
  SEGMENTS.forEach((s,i)=>{
    const a = i*SEG, b = a+SEG;
    if(s.sur){ const m = a+SEG/2; stops.push(`var(--sa) ${a}deg`,`var(--sa) ${m}deg`,`var(--sb) ${m}deg`,`var(--sb) ${b}deg`); }
    else { const c = i%2 ? 'var(--pb)' : 'var(--pa)'; stops.push(`${c} ${a}deg`,`${c} ${b}deg`); }
  });
  rotor.style.background = `repeating-conic-gradient(from 0deg,rgba(140,240,190,.45) 0deg .6deg,transparent .6deg ${SEG}deg),conic-gradient(from 0deg,${stops.join(',')})`;
  SEGMENTS.forEach((s,i)=>{
    const a = document.createElement('a');
    a.className = 'chip' + (s.feat?' feat':'') + (s.sur?' sur':'');
    a.style.setProperty('--ac', s.accent);
    if(s.href){ a.href = s.href; a.target = '_blank'; a.rel = 'noopener'; }
    else { a.href = '#'; a.setAttribute('aria-label','Sorpresa'); a.addEventListener('click', e => e.preventDefault()); }
    a.innerHTML = `<div class="card">${svg(s.icon)}<span>${s.label}</span></div>`;
    rotor.appendChild(a); chips.push(a);
  });
})();
function layout(){
  const r = rotor.clientWidth * .335;
  chips.forEach((el,i)=>{
    el.style.marginLeft = -el.offsetWidth/2 + 'px';
    el.style.marginTop = -el.offsetHeight/2 + 'px';
    el.style.transform = `rotate(${(i+.5)*SEG}deg) translate(0,-${r}px)`;
  });
}
layout();
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 80); });
document.fonts && document.fonts.ready.then(layout);

/* lista alternativa */
(function(){
  const fl = $('fl');
  SEGMENTS.filter(s=>s.href).forEach(s=>{
    const a = document.createElement('a');
    a.href = s.href; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = `${s.label}<span style="color:var(--cy)">→</span>`;
    fl.appendChild(a);
  });
  $('lt').onclick = () => fl.classList.toggle('show');
})();

/* ===== SONIDO Y VIBRACIÓN ===== */
let ac = null;
function tick(freq=620, dur=.04, vol=.05){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  }catch(e){}
}
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

/* ===== CONFETI ===== */
const cv = $('fx'), cx = cv.getContext('2d');
let parts = [], fxOn = false;
function fit(){ cv.width = innerWidth; cv.height = innerHeight; }
fit(); addEventListener('resize', fit);
function confetti(colors, big){
  if(reduce) return;
  const n = big ? 170 : 110, ox = innerWidth/2, oy = innerHeight*.4;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = Math.random()*(big?13:10)+4;
    parts.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,w:Math.random()*8+4,h:Math.random()*5+3,
      r:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[i%colors.length],life:1});
  }
  if(!fxOn){ fxOn = true; requestAnimationFrame(drawFx); }
}
function drawFx(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts = parts.filter(p => p.life > 0 && p.y < cv.height + 20);
  parts.forEach(p=>{
    p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .006;
    cx.save(); cx.globalAlpha = Math.max(p.life,0); cx.translate(p.x,p.y); cx.rotate(p.r);
    cx.fillStyle = p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
  });
  if(parts.length) requestAnimationFrame(drawFx); else { fxOn = false; cx.clearRect(0,0,cv.width,cv.height); }
}

/* ===== MOTOR DE GIRO ===== */
const stage = $('stage'), spin = $('spin'), status = $('status'), glow = $('glow'),
      pointer = $('pointer'), result = $('result');
let rotation = 0, mode = 'ambient', last = null, chosen = 0, lastSeg = -1;
let d0 = 0, d1 = 0, t0 = 0;
const AMBIENT = reduce ? 0 : 9, DUR = reduce ? 1200 : 5600;
const easeOut = t => 1 - Math.pow(1 - t, 4);
const segUnderPointer = () => Math.floor((((-rotation) % 360) + 360) % 360 / SEG) % N;

function flick(){
  pointer.animate([{transform:'translateX(-50%) rotate(-20deg)'},{transform:'translateX(-50%) rotate(0)'}],{duration:130,easing:'ease-out'});
}
function frame(ts){
  if(last === null) last = ts;
  const dt = Math.min((ts - last)/1000, .05); last = ts;
  if(mode === 'ambient'){
    rotation += AMBIENT * dt;
  } else if(mode === 'decel'){
    const t = Math.min((ts - t0)/DUR, 1);
    rotation = d0 + (d1 - d0) * easeOut(t);
    const s = segUnderPointer();
    if(s !== lastSeg){ lastSeg = s; flick(); tick(540 + t*260); if(t < .9) buzz(6); }
    if(t >= 1){ mode = 'idle'; landed(); }
  }
  rotor.style.transform = `rotate(${rotation}deg)`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { last = null; });

function lock(v){ chips.forEach(c => c.dataset.lock = v ? '1' : '0'); }
function clearWin(){
  chips.forEach(c => c.classList.remove('won'));
  glow.classList.remove('on'); stage.classList.remove('win'); result.classList.remove('show');
}

spin.addEventListener('click', () => {
  if(mode === 'ambient'){
    chosen = Math.floor(Math.random() * N);
    const cur = ((rotation % 360) + 360) % 360;
    const jitter = (Math.random() - .5) * SEG * .6;
    const target = ((-(chosen + .5) * SEG + jitter) % 360 + 360) % 360;
    let delta = target - cur; if(delta <= 0) delta += 360;
    d0 = rotation; d1 = rotation + (reduce ? 0 : 6) * 360 + delta;
    t0 = performance.now(); lastSeg = segUnderPointer(); mode = 'decel';
    lock(true); clearWin();
    spin.disabled = true; spin.classList.remove('alert'); spin.textContent = 'Girando…';
    status.textContent = 'Calibrando destino…';
    tick(300, .08, .06); buzz(20);
  } else if(mode === 'idle'){
    mode = 'ambient'; last = null; clearWin();
    spin.classList.add('alert'); spin.textContent = 'Detener';
    status.textContent = 'Toca «Detener» para elegir';
  }
});

function landed(){
  const s = SEGMENTS[chosen], el = chips[chosen];
  lock(false); el.classList.add('won'); stage.classList.add('win');
  glow.style.setProperty('--ac', s.accent); glow.classList.add('on');
  result.style.setProperty('--ac', s.accent);
  $('rIco').innerHTML = svg(s.icon);
  const cta = $('rCta');
  if(s.sur){
    status.textContent = '¡Sorpresa!';
    $('rTitle').textContent = '¡Te tocó una sorpresa!';
    $('rDesc').textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
    cta.style.display = 'none';
    confetti(['#ff2e93','#ffd23f','#ffffff','#39e28f','#2fa2ff'], true);
    [660,830,990,1320].forEach((f,i) => setTimeout(() => tick(f,.12,.07), i*90));
    buzz([40,40,80]);
  } else {
    status.textContent = s.label;
    $('rTitle').textContent = s.label;
    $('rDesc').textContent = s.desc;
    cta.href = s.href; cta.style.display = '';
    confetti([s.accent,'#ffffff','#39e28f','#f5c542']);
    tick(880,.15,.07); setTimeout(() => tick(1180,.2,.07), 110); buzz(30);
  }
  result.classList.add('show');
  spin.disabled = false; spin.textContent = 'Girar de nuevo';
  setTimeout(() => result.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'nearest'}), 250);
}
</script>
